[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-brief-agent"
version = "0.1.0"
description = "基于 LangChain 与本地 JSON 存储的个性化新闻简报 Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "filelock>=3.16,<4",
  "feedparser>=6.0,<7", "trafilatura>=2.0,<3", "lxml>=5,<7",
  "apscheduler>=3.11,<4", "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2", "python-dotenv>=1.0,<2", "ddgs>=9.16,<10"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
newsbrief = "news_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

